# Alembic config for running migrations by hand from backend/:
#   alembic upgrade head          (uses CADIS_DATA_DIR / CADIS_DATABASE_URL)
#   alembic revision --autogenerate -m "describe change"
# The app runs the same migrations at startup (cadis.storage.db.init_db).
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
